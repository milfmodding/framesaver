# Framesaver protocol - marathon per-map mod-on/mod-off (4.1 rebaseline campaign)
#
# Authored 2026-08-16 by Tau for Sophia's marathon session
# (GZ->Streets->Interchange->Customs->Factory->Woods->Reserve->Lighthouse->Shoreline).
# Copy to  BepInEx\config\framesaver.protocol.ini  to arm it.
#
# WHAT THIS MEASURES: the protocol-addressable half of "mod on vs mod off".
# Arms toggle the four uniquely-named shipping levers between as-shipped
# defaults (ON) and vanilla behaviour (OFF):
#   Cull sleeping bot animators      (ON: true   OFF: false)
#   Fix dead-agent leak              (ON: true   OFF: false)
#   Max delta time                   (ON: 0.1    OFF: 0 = Unity default)
#   Drain completions in Update only (ON: true   OFF: false)
# All four are documented live-toggglable (applied per-frame or per-call;
# the cull A/B ran exactly this shape through the 4.0.13 corpus).
#
# WHAT IT CANNOT MEASURE - read before quoting the result:
#   [1. Bot stand-by] Enabled is NOT in these arms. Two settings carry the
#   bare key `Enabled` (stand-by and telemetry), the runner resolves by bare
#   key, and the wrong one would kill the telemetry. The stand-by system runs
#   for the whole session in every arm. The FULL mod-off comparison -
#   including stand-by - is a separate config-toggled raid (Lighthouse,
#   between raids only; see check-modoff.py, gates all six levers).
#   So this protocol answers "what do the fix-layer levers buy, with
#   stand-by running", NOT "what does the whole mod buy".
#
# DESIGN: warmup (settle) then ABAB, 180s per arm (Echo's review: every arm
# boundary costs one partial window to the flush, so 120s leaves ~3 clean
# windows per arm and 180s leaves ~5; total hold 2+4x3 = 14min). Two pairs
# give the delta; per-map repetition across the marathon gives the error
# bars the corpus would have taken three pairs for. ABAB kept deliberately:
# the register measured held-raid drift as convex-with-a-step, under which
# ABBA biases in the FLATTERING direction - ABAB's bias is known and
# disclosable, and the protection lives in the read (pooled within-map
# estimator + per-pair roster-balance check), not the ordering. Every arm
# pins all four keys explicitly - no arm inherits a value from the previous
# one by accident.
#
# Drop every window with "flushedByProtocol": true - those are partial.

@name = modonoff-41
@seconds = 120

# Not scored. Spawn wave landing + roster settling; bots awake count moves
# for reasons unrelated to any arm.
[warmup]
@seconds = 120
Cull sleeping bot animators = true
Fix dead-agent leak = true
Max delta time = 0.1
Drain completions in Update only = true

# A = OFF. Vanilla behaviour on all four levers.
[A1]
@seconds = 180
Cull sleeping bot animators = false
Fix dead-agent leak = false
Max delta time = 0
Drain completions in Update only = false

# B = ON. As-shipped defaults.
[B1]
@seconds = 180
Cull sleeping bot animators = true
Fix dead-agent leak = true
Max delta time = 0.1
Drain completions in Update only = true

[A2]
@seconds = 180
Cull sleeping bot animators = false
Fix dead-agent leak = false
Max delta time = 0
Drain completions in Update only = false

[B2]
@seconds = 180
Cull sleeping bot animators = true
Fix dead-agent leak = true
Max delta time = 0.1
Drain completions in Update only = true

# Stand-down - REQUIRED as the last arm. Advancing writes settings live and
# nothing restores them; a raid that ends on A leaves the cull and the leak
# fix OFF for every later raid this session, silently downgrading the mod.
# @seconds = 0 means "wait for the key" - press the protocol key (or extract)
# to leave the raid on shipping defaults.
[standdown]
@seconds = 0
Cull sleeping bot animators = true
Fix dead-agent leak = true
Max delta time = 0.1
Drain completions in Update only = true
