# Framesaver measurement protocol - Lighthouse, THIRD PASS. SUPERSEDES v2.
#
# Copy to  BepInEx\config\framesaver.protocol.ini  to arm. Read at RAID START.
#
# Use this instead of v2. It contains v2's B1/B2 contrast unchanged, so it still
# answers what v2 answered, and adds the third dose that answers a better
# question. v2 stays in the repo as the design that would have been run.
#
# ---------------------------------------------------------------------
# THE QUESTION THIS EXISTS FOR, WHICH IS NOT THE ONE v1 AND v2 ASKED
# ---------------------------------------------------------------------
#
# Delta established from aiTotal.min that per-tick cost inflates at least 3x on
# the sliced arm for EVERY admissible fixed component, so roughly half the
# deferred brain work comes back as more expensive ticks. That reframes the whole
# feature: the ceiling is low because the LEVER IS INEFFICIENT, not because the
# quantity is small. The registered 38-78% share may be right; the broken
# inference was "big share implies big saving".
#
# So the question worth a raid is no longer "how big is the saving". It is WHY
# per-tick cost rises, because the two candidates have opposite consequences:
#
#   TIME-PROPORTIONAL work (pathing and sensors over accumulated dt) means cost
#   per tick scales with the gap since that agent last ticked. All the deferred
#   work returns, no period recovers it, and rule 3's real budget is near zero.
#
#   COLD-AGENT / CACHE effects mean a fixed penalty per tick regardless of gap.
#   Cost saturates, a different GROUPING could recover it, and rule 3 survives.
#
# ---------------------------------------------------------------------
# WHY A THIRD DOSE AND NOT A NEW TELEMETRY FIELD
# ---------------------------------------------------------------------
#
# Delta asked for a per-tick cost histogram or a per-agent gap field. That needs
# a patch change, a telemetry change, a build, a deploy and a new GO - and it
# would not work as intended anyway, because the scheduler is a ROUND-ROBIN over
# a cursor (AICoreControllerUpdatePatch.cs:132-141). Every agent is ticked once
# per full pass, so within one config the gap is the SAME for every agent. There
# is no within-arm variation to regress cost against.
#
# The gap is set by the config, so it has to be varied by the ARM. Three doses
# give three (gap, per-tick cost) points with no new field and no build.
#
# ---------------------------------------------------------------------
# WHY 0.020 AND NOT A LIGHTER SLICE - THE ARITHMETIC THAT PICKED IT
# ---------------------------------------------------------------------
#
# I first proposed a LIGHTER dose (period 0.3, min-brains 1 -> perFrame 2) on the
# reasoning that a longer gap makes time-proportional work more visible. Then I
# costed it and it is underpowered, so it is recorded here rather than run.
#
# At 23 live and ~13.9 ms frames, with F = 0.876 and control tick work T = 0.520
# from Delta's population-matched pair:
#
#   dose 2/23   constant-per-tick predicts 0.921   conserved predicts 1.181
#               models differ by 0.045 at most, against a 0.050 ms floor. Dead.
#
# The reason is that at 4/23 the tick work is ALREADY mostly removed, so going
# to 2/23 only removes another 2/23 of T. Chasing the residual of a small term.
#
# The models diverge where tick work is LARGEST, so the discriminating arm is a
# HEAVIER dose, not a lighter one. I first wrote period 0.03 (perFrame 11) and
# Delta showed that is one notch too light: tick work is largest at HIGH perFrame,
# not merely higher than 4, and at 11 the single limb B3 exists to settle is
# tested at only 2.5 sigma.
#
#   period 0.020 -> framesPerPass = 0.020/0.0139 = 1.44
#                   perFrame = ceil(23/1.44) = 16,  dose 16/23 = 0.696
#                   gap = 23/16 = 1.4 frames
#
# THE HYPOTHESES, AND TWO OF THEM ARE ALREADY DEAD. Raid 1 killed both
# single-parameter models by itself: constant-per-tick predicted 1.125 and fully-
# conserved predicted 1.396, and B2 came in at 1.1805, between them. Do not build
# the table around corpses - it makes the live hypotheses look like edge cases.
#
# What raid 1 actually fitted, from control and B2 alone, is the two-parameter form
# c(gap) = a + b*gap:
#
#     a, gap-independent    0.01140 ms
#     b, per frame of gap   0.01121 ms
#
# **So "time-proportional or cold-agent" already HAS an answer: both, in roughly
# equal measure at gap 1.** B3 is therefore not a fitting point, it is a HELD-OUT
# TEST of whether c(gap) stays linear at a gap the fit never saw.
#
#     held-out prediction at perFrame 16      1.316  (+- 0.031 at n=4)
#     pure gap-proportional (a = 0)           4.4 sigma away
#     saturated / cold-agent                 24.3 sigma away
#
# THE BRANCH v1 TAUGHT US TO WRITE DOWN. The saturated model predicts aiTotal
# ABOVE control - at perFrame 11 it is 1.695 against a control of 1.396, worse by
# +0.299 ms - and it gets further above as the dose rises. **An above-control
# result is a real branch and my earlier prediction range excluded it**, which is
# exactly how v1 produced a verdict neither Delta nor I had a slot for. If B3 reads
# HIGHER than B1, the reading is: per-slice overhead that does not scale with the
# work deferred, and slicing is a cost at high dose rather than a saving.
#
# WHAT THIS RAID DOES NOT SETTLE, registered here so a 4.4 sigma result is not
# over-read. **At no dose does this design separate `a` from `b` better than about
# 5 sigma**, because that split is best determined at small gap and control already
# sits there. The a-versus-b decomposition is a RAID 1 result. Raid 2 tests only
# whether c(gap) is linear at all.
#
# THE TRADE, stated because it is deliberate: the saving at perFrame 16 is smaller
# than at 11 (1.316 against 1.396 control). That is the right thing to give up -
# the saving is already bounded and actionable, the mechanism is the thing no other
# measurement can reach.
#
# NOTE the floor does NOT bind: perFrame 16 far exceeds min-brains 4, so the
# clamp's lower bound is inactive and the period is doing the work - unlike v1,
# where the floor and the period both produced 4 and could not be told apart.
# min-brains is still stated in every block, because an unstated knob is inherited
# from disk.
#
# PERIOD RANGE: AcceptableValueRange is 0-0.5 for the period and 1-64 for
# min-brains, so every value below is legal and will not be clamped on assignment.
#
# ---------------------------------------------------------------------
# WHAT TO SCORE
# ---------------------------------------------------------------------
#
# PRIMARY IS aiTotal.min, NOT aiTotal.avg, and the reason is a conditioning result
# rather than a preference. On the matched pair at live == 23, n=2 windows per arm:
#
#     the saving   ai_c - ai_s      0.2155 ms   se 0.0435   CI +0.028 .. +0.403   +-87%
#     the bound    1 - F/ai_c       0.3725      se 0.0086   CI 0.335 .. 0.410     +-10%
#
# 8.7x better conditioned at IDENTICAL n, and structurally so: the saving is a
# DIFFERENCE of two levels, so the levels cancel and their noise does not. The
# bound is a RATIO of two levels that are each individually stable - control
# aiTotal.avg se 0.002, sliced aiTotal.min se 0.012. Even at df=1 the bound is
# 26-48%, which excludes the contrast-based 10-13% region outright.
#
# CONSEQUENCE FOR THIS RAID: the share is nearly resolved at two windows per arm
# already. So the four windows per arm below are budgeted for the SAVING, and the
# share rides along for free. If the raid ends early - raid 1 ended at 11 minutes -
# the min channel still returns a usable bound from whatever blocks completed,
# which the contrast does not.
#
# Delta's generalisation, worth more than this raid: at small n a LEVEL is
# estimable and a DIFFERENCE OF LEVELS is not. Anywhere we have been scoring an
# intervention on a difference, there may be a level carrying the same information
# an order of magnitude more cheaply.
#
# Population-match across ADJACENT blocks rather than standardising for live.
# Delta's bound came from live == 23 exactly, and a bound is only as good as the
# population it was taken on - which matters more now that it is primary.
#
# THE DISCRIMINATOR: ms per tick with F subtracted, against the gap, over three
# doses. Gap ~1, ~1.4 and ~5.75 frames. Time-proportional work makes that line
# pass near the origin with a slope; a cache penalty makes it a step that flattens.
# Raid 1 already put a at 0.01140 and b at 0.01121, so the line is fitted and B3
# tests it out of sample rather than adding a third point to the fit.
#
# frame.p50 IS NOT SCOREABLE. In raid 1 its bracket contrast was +0.335 ms -
# larger than the aiTotal drop - and it is drift: p50 was monotone in raid order
# while aiTotal was not, and a monotone ramp cannot make a middle dip. The ramp is
# independently visible in updateManual awake ms/call, which rose 0.0338 -> 0.1018
# monotonically across all ten windows unbroken by the arm. A positive p50 will
# appear in this table too and must be labelled drift, not quoted as a saving.
#
# ENGAGEMENT CHECK is agents.slicing and agents.suppressSlicing, never
# tickedSum/liveSum alone - that ratio is 1.0000 by construction in the control
# arm. `Defer to other AI mods` must be false before launch or BigBrain
# suppresses slicing while the log still reports the period you asked for.
#
# A BONUS AND ITS CONFOUND: perFrame is recomputed from live deltaTime each
# frame, so the dose drifts a little with frame time and tickedSum/liveSum records
# what actually happened rather than what was asked for. That gives some
# within-arm gap variation for free - but it is correlated with frame time itself,
# so it is a weak instrument and must not be presented as a clean within-arm
# regression.

name = brain-slice-lighthouse-v3

# --- Excluded. Hold position, let the map settle. Three minutes. -----
#
# Not warmup of the instrument. Raid 1's first window ran the FASTEST 60 s of the
# raid with 10 awake bots and the player still at the spawn end - the bots were
# genuinely not engaged. A real state with real variance, which is why it is a
# labelled block that pools with nothing rather than an outlier trimmed later.
[WARMUP]
Brain update period = 0
Minimum brains per frame = 4

# --- Six measurement blocks, two minutes each. ----------------------
#
# Two full 60 s windows per block, two blocks per arm, four windows per arm. At
# Delta's 0.050 ms post-warmup floor that resolves ~0.09 ms, well inside the
# ~0.135 ms the competing models are apart.
#
# Interleaved rather than blocked so position and elapsed time are crossed with
# dose instead of confounded with it.

[B1]
Brain update period = 0
Minimum brains per frame = 4

[B2]
Brain update period = 0.1
Minimum brains per frame = 4

[B3]
Brain update period = 0.020
Minimum brains per frame = 4

[B1]
Brain update period = 0
Minimum brains per frame = 4

[B2]
Brain update period = 0.1
Minimum brains per frame = 4

[B3]
Brain update period = 0.020
Minimum brains per frame = 4

# Stand-down. Not a measurement block. Advance() writes ConfigEntry.BoxedValue
# and nothing restores it, so a raid ending on a sliced arm leaves that period
# live in memory and every later raid runs silently sliced. Press on extraction.
[standdown]
Brain update period = 0
Minimum brains per frame = 4
