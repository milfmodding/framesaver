# Framesaver protocol - does the animator cull actually buy the frame time?
#
# Copy to  BepInEx\config\framesaver.protocol.ini  to arm it.
# Format reference is protocol-example.ini.
#
# =====================================================================
# BLOCKERS CLEARED 2026-08-04 - this protocol is ARMED AND RUNNABLE
# =====================================================================
#
# Until 2026-08-04 this block was a fenced DO NOT RUN banner. Every build
# premise in it is now false, measured against the DEPLOYED BINARY rather
# than inferred from the fact that a deploy happened. Rewritten rather than
# deleted: a reader who remembers the banner needs to see what became of it,
# and one clause of it is still open.
#
#   WAS  the gated build bc90b76 is installed
#   NOW  FALSE - md5 ec03778966215d4888494e6334ea33a8, stamp 9b4b264,
#        deployed 2026-08-04 20:43.
#
#   WAS  `animCulledEngine` is absent from the installed DLL - the field
#        that certifies ARM DELIVERY, without which a run cannot separate
#        "the cull worked" from "the config flipped and nothing happened"
#   NOW  FALSE - present, UTF-16 byte scan of the deployed DLL.
#
#   WAS  it still carries `Force fast body animator` (removed in 299fd86)
#   NOW  FALSE - absent, UTF-16 and UTF-8.
#
#   THE SCAN DISCRIMINATES. Control literal `zzzNotARealFieldName` came back
#   absent on the same bytes and `Decouple cull from stand-by` came back
#   present, so an absence here is a measurement and not a scan that finds
#   nothing. The retired keys `deadAwake` and `standByBlocked` are also gone,
#   which confirms 3ad1b55 is in the SHIPPED DLL and not only in the tree.
#
#   WAS  Delta reviews the coupled-path diff first
#   NOW  DONE, and against the DEPLOYED stamp rather than the older
#        candidate: aeec0d4..9b4b264 touches SleepingBotAnimatorPatch.cs and
#        Telemetry.cs in exactly two commits, 3ad1b55 and d893a01, both
#        already adjudicated. 9b4b264..cc61223 changes no .cs or .csproj.
#
# ONE CLAUSE OF THE OLD BANNER IS NOT A BUILD FACT AND IS STILL OPEN.
# f218743 registered its prediction against a COUPLED build, and whether that
# registration survives a new binary is Sophia's call, not the deployer's.
# Delta established that f218743 was never a GATE - it was a signed condition
# satisfied by a default flag - but "was never a blocker" and "Sophia has made
# the call" are different claims and only the first is settled here.
#
# WHY THAT OPEN CLAUSE DOES NOT BLOCK THIS RUN: every one of the eight
# sections below pins `Decouple cull from stand-by = false`, so this protocol
# executes the COUPLED path the registration was written against. Verified
# section by section, one pin each, not eight occurrences counted in bulk.
#
# CHECK 1 SURVIVES NOW. CHECK 3 IS EMITTED BUT UNREAD - see check 3 below.
#
# =====================================================================
# THE QUESTION
# =====================================================================
#
# `Cull sleeping bot animators` has NEVER been A/B'd. It is true in all 24
# mod-on logs and false only in the mod-off leg, so there is no leg anywhere in
# the corpus with stand-by on and the cull off - and it is now the lever we
# think does nearly all the work.
#
# Alpha's between-leg fit puts PreLateUpdate/DirectorUpdateAnimationBegin at
# ~0.22 ms per awake bot, reproducing across two maps and five legs. Stand-by's
# own gating (updateManual awake vs paused) saves ~0.011 ms per bot. Twenty
# times apart. If that holds, stand-by's real job is deciding WHICH bots are
# safe to cull, and the cull is where the milliseconds come from.
#
# This measures it within one raid, because between-leg has already visibly
# failed: Reserve went the wrong way by 10.4 fps, and one of the mod-on legs
# carries `commit: None`, so it is not even a known binary.
#
# =====================================================================
# WHY THE TWO SKIPS ARE PINNED OFF IN EVERY ARM
# =====================================================================
#
# NOT tidiness. `Skip sleeping bot LateUpdate` makes this experiment
# unmeasurable, and silently.
#
# Player.VisualPass rewrites cullingMode on every call, which is what makes the
# cull reversible - drop the flag and the next frame restores vanilla. But
# VisualPass has exactly ONE call site in the whole assembly, inside
# Player.LateUpdate. Skipping LateUpdate for sleeping bots therefore suppresses
# the only thing that would undo the cull, so a bot asleep at an arm boundary
# stays culled for as long as it stays asleep. Arm B inherits arm A, and on a
# map with twenty sleeping bots that is most of the population.
#
# `Skip sleeping bot world tick` does not cause that - GameWorld's tick is not
# the VisualPass call site - but it removes real work of its own, which would
# ride along on whichever arm it is in. Off, so the contrast is the cull alone.
#
# Written into every arm rather than set once. A protocol that is advanced by
# hand can skip a step, and an arm that does not restate its own conditions is
# an arm you have to reconstruct from the arm before it.
#
# =====================================================================
# AND THE THIRD PIN, ADDED 2026-08-04 - THE ONE THIS FILE ARGUED FOR AND
# THEN LEFT TO A DEFAULT
# =====================================================================
#
# `Decouple cull from stand-by = false` is now pinned in all eight arms too.
# Until today this file pinned the two skips in every arm - on the reasoning
# three lines above - and said NOTHING about the decoupled cull, relying on its
# default being off.
#
# THAT IS THE MORE DANGEROUS OMISSION OF THE TWO. With the flag ON, the cull's
# eligible set becomes every live AI player instead of `Sleeping`, so BOTH arms
# measure a different population - and the contrast still produces a clean,
# plausible number with nothing anywhere saying the denominator moved. The skips
# fail loudly by comparison: they suppress work you can see missing.
#
# This is exactly what f218743's buildValidity field warned about, in my own
# words on 2026-07-31: *"if the decoupled cull ships, the eligible set becomes
# every AI player rather than Sleeping.Count, so both arms would mean something
# different and the level shift would be measured over a different population.
# The protocol must be rewritten before it runs against a decoupled build."*
# The registration carries across BECAUSE the flag is off - which is a condition
# to be checked, and until now the check rested on a default nobody restated.
#
# THE FLAG IS NEW TO THE LIVE CONFIG. The installed build predates it
# (bc90b76), so BepInEx writes the default into framesaver.cfg on first run of
# the new binary. READ IT BACK after the deploy rather than assuming it: "the
# default is false" and "the config says false" are different claims, and the
# whole reason this pin exists is that the second one is the one that matters.
#
# `Force fast body animator` is NOT a step here and cannot be: it applies at
# startup, and the build now refuses to force it while the cull is on, because
# it replaces Unity's Animator with a class whose cullingMode is inert - which
# would delete the cull while `animCulled` still reported it working.
#
# =====================================================================
# HOW TO READ THE RESULT
# =====================================================================
#
# The contrast is `phases` DirectorUpdateAnimationBegin against `bots.awake`,
# fitted WITHIN this raid across arms.
#
# Three checks that say whether the run is readable at all, before any fit:
#
#   1. `animCulledEngine` should read about `bots.asleep` on every cull arm and
#      about 0 on every control arm. It reads the engine rather than our
#      intent: `animCulled` reports what we ASKED for and drops to 0 the
#      instant the flag flips, whether or not the engine let go.
#
#      IN THIS RUN it certifies two things, and NOT a third:
#        - arm delivery: the cull arm actually reached the engine, not just
#          the config
#        - the write landing: it agrees with `animCulled` on a cull arm, so
#          nothing inert is swallowing the write
#      It does NOT rule out a latch here, because pinning the LateUpdate skip
#      off removes the only mechanism that produces one. The latch is DESIGNED
#      OUT, not measured away. Read a clean control arm as "the design held",
#      never as "we checked for a latch and found none" - that claim needs a
#      protocol that moves the skip, and this one deliberately does not.
#
#      And note what CANNOT fail here: with the fast-animator setting removed,
#      no reachable config makes `animCulledEngine` < `animCulled` on a cull
#      arm. So agreement in game is not evidence the instrument works. Both
#      directions ARE tested, with controls, in tests/unwrap - which is where
#      to look before trusting an agreement, not at the log.
#
#   2. `bots.awake` should be roughly EQUAL across arms. The cull changes how a
#      sleeping bot is drawn, not who sleeps. If the awake count moves with the
#      arm, something other than the cull moved and the slope is not the cull's.
#
#   3. `animCulledOffScreen` over `animCulled` is the fraction of the marking
#      Unity could honour. A low ratio on an open map is the interesting
#      failure; on Reserve, where the slope is five times flatter, it is the
#      first thing to look at.
#
#      NO READER IMPLEMENTS THIS (Delta, 2026-08-04). The field IS emitted
#      by the deployed build, but `read-animcull.py` never dereferences it -
#      the only files that mention it are two fixtures and a crashtest that
#      FABRICATES it. So check 3 is recoverable from any log, and is not run
#      by anything today. Do not read a clean run as check 3 having passed.
#      Deliberately not fixed before the raid: ac-crashtest.py currently
#      cannot fail, so adding a check whose validating harness is incapable
#      of failing would be the defect this file exists to avoid.
#
# Drop every window with "flushedByProtocol": true - those are partial.
#
# =====================================================================

@name = anim-cull
@seconds = 120

# Not scored. Let the map load, the spawn wave land and the roster settle;
# early windows have bots arriving, which moves `bots.awake` for reasons that
# have nothing to do with the arm.
[warmup]
@seconds = 180
Cull sleeping bot animators = true
Skip sleeping bot LateUpdate = false
Skip sleeping bot world tick = false
Decouple cull from stand-by = false

# A = cull off. The control, and the state no log in the corpus has ever been in
# with stand-by running.
[A1]
Cull sleeping bot animators = false
Skip sleeping bot LateUpdate = false
Skip sleeping bot world tick = false
Decouple cull from stand-by = false

[B1]
Cull sleeping bot animators = true
Skip sleeping bot LateUpdate = false
Skip sleeping bot world tick = false
Decouple cull from stand-by = false

[A2]
Cull sleeping bot animators = false
Skip sleeping bot LateUpdate = false
Skip sleeping bot world tick = false
Decouple cull from stand-by = false

[B2]
Cull sleeping bot animators = true
Skip sleeping bot LateUpdate = false
Skip sleeping bot world tick = false
Decouple cull from stand-by = false

# Third pair. ABAB twice over is what separates the cull from raid drift: A1-A2
# and B1-B2 are the same arm at different times, so the within-arm spread is the
# noise the between-arm delta has to beat. Two pairs give you a delta; three
# give you a delta and an error bar.
[A3]
Cull sleeping bot animators = false
Skip sleeping bot LateUpdate = false
Skip sleeping bot world tick = false
Decouple cull from stand-by = false

[B3]
Cull sleeping bot animators = true
Skip sleeping bot LateUpdate = false
Skip sleeping bot world tick = false
Decouple cull from stand-by = false

# Stand-down. Advancing writes settings live and nothing restores them, so a
# raid that ends on A leaves the cull OFF for every later raid this session -
# and the cull is on by default, so that is a silent downgrade of the mod
# itself. Unboxed: press it on extraction, or let the raid end here.
[standdown]
@seconds = 0
Cull sleeping bot animators = true
Skip sleeping bot LateUpdate = false
Skip sleeping bot world tick = false
Decouple cull from stand-by = false
