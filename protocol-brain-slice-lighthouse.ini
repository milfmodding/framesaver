# Framesaver measurement protocol - brain slicing A/B, CLOSING Lighthouse leg.
#
# Route: Lighthouse (clean) -> Woods (clean) -> Reserve (clean) -> Lighthouse
# (this protocol). It runs LAST because Advance() writes ConfigEntry.BoxedValue
# and nothing restores it - a leg that ends on B2 leaves 0.1 live in memory and
# every later leg silently runs sliced. Last means there is nothing after it to
# contaminate. Beta found this; the stand-down step below is belt to that brace.
#
# Copy to  BepInEx\config\framesaver.protocol.ini  to arm. Read at RAID START,
# so installing it now needs no client restart and does not cost the
# session-age control.
#
# Advance with Ctrl+Alt+PageDown. Press roughly every 4 MINUTES, by the clock
# and not at landmarks: the leg is a traversal, so choosing presses by location
# lets terrain correlate with the arm - the confound that cost us the Customs
# drift claim.
#
# The window each press cuts short carries "flushedByProtocol": true. It is a
# partial window. Discard it; do not average it in.
#
# PRIMARY IS framePct.p50. Spike counts (period >= 100) are DESCRIPTIVE only:
# at this leg length they detect ~4x, so a null on them is not evidence of
# absence. Two further reasons not to score hitches here: perFrame divides by
# deltaTime, so a slow frame ticks MORE brains - on a 200 ms frame the sliced
# arm ticks every brain, exactly like control, and the treatment converges to
# the control precisely where the hitch is.
#
# WHY SIX BLOCKS, ALTERNATING. Three control and three sliced, so map position
# is crossed with condition instead of confounded with it. One contiguous block
# per arm on a traversal makes position, bot count and elapsed time collinear
# with the arm by construction.
#
# THIS IS A FLOOR-AND-PERIOD ARM, NOT A PERIOD TEST. perFrame =
# ceil(live x dt / period), clamped up to `Minimum brains per frame` = 4. The
# period only binds above 4 x period / dt agents - 25 at 16 ms, 40 at 10 ms.
# Lighthouse at ~29 live and ~16 ms frames is the ONLY map in the corpus where
# the period is the live variable at all, and even there it yields perFrame 5
# against the floor's 4. Attribute the result to "slicing on with floor 4",
# never to 0.1 specifically.
#
# Two quantities that are easy to confuse, and the analysis turns on both:
#   - the DOSE is large. 5 ticks against control's ~29 is a ~5.8x cut.
#   - the period's MARGIN OVER THE FLOOR is small, 5 against 4.
# A large effect is entirely possible here; what is weak is attributing it to
# the period knob rather than to slicing-with-a-floor.
#
# HOW TO TELL THE LEVER ENGAGED - and it is NOT tickedSum / liveSum alone.
# Under brainPeriod = 0 that ratio is exactly 1.0000 by construction:
# AICoreControllerUpdatePatch.cs:104 assigns LastBrainsTicked = LiveAgents on
# the same frame the denominator counts. A flat 1.0000 baseline is a tautology,
# not a working instrument. Use `agents.slicing` and `agents.suppressSlicing` -
# they separate "the lever did not engage" from "the sums are broken". The
# ratio is a real measurement in the SLICED arm only, where it is the arm's own
# per-window dose covariate and should be carried into the analysis as one.
#
# `Minimum brains per frame` is deliberately NOT set. A second knob moving is a
# confound, and the floor is what makes the treatment a fixed 4-or-5 per frame.

name = brain-slice-lighthouse

# EVERY block states the value explicitly, including this first one.
#
# An empty step inherits whatever is on disk. ResetForRaid() restarts at step 1
# on a new raid WITHOUT undoing the previous raid's assignments, so an empty
# first step would stamp "B1" onto windows still running at 0.1. cfg.brainPeriod
# is read live per window so the log would expose the contradiction, but there
# is no reason to author a trap and rely on catching it downstream.
[B1]
Brain update period = 0

[B2]
Brain update period = 0.1

[B1]
Brain update period = 0

[B2]
Brain update period = 0.1

[B1]
Brain update period = 0

[B2]
Brain update period = 0.1

# Stand-down. NOT a measurement block - exclude it from analysis; the six above
# stay balanced 3v3. Press it on extraction if the leg gets that far. It is no
# longer load-bearing now that the A/B runs last, but it costs one line and it
# protects any raid played after this one.
[standdown]
Brain update period = 0
