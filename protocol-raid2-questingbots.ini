# Framesaver measurement protocol - RAID 2. QuestingBots installed, reclaim ON.
#
# Copy to  BepInEx\config\framesaver.protocol.ini  to arm. Read at RAID START.
#
# ---------------------------------------------------------------------
# WHAT THIS RAID IS FOR, in order of what it can lose
# ---------------------------------------------------------------------
#
# PRIMARY, release-blocking, and it needs no arms at all: does reclaim work?
# QuestingBots clears BotOwner.StandBy.CanDoStandBy on every bot as it
# activates, which switches off Framesaver's whole stand-by system - the cull,
# both skips, the sniper exemption, all of it keys off the paused state. So:
#
#     bots.asleep         must be > 0 in the in-raid windows
#     agents.mods         must contain QuestingBots
#     bossGroups.linked   > 0 if a garrison spawned, else linkage failed
#
# `asleep` reading 0 with QuestingBots present and reclaim ON means reclaim is
# BROKEN, not merely defaulted off - and that is invisible to every other
# signal in the log, which is why it is the primary.
#
# SECONDARY, and the reason this file has arms: `Force for all roles`.
#
# THIS PARAGRAPH WAS WRONG UNTIL 2026-07-30 and the correction is the reason the
# arms changed. It said the flag was armable only with QuestingBots installed,
# because QB keeps clearing `CanDoStandBy` and TryReclaimStandBy re-grants every
# CheckInterval, consulting the flag each time.
#
# QB clears the flag ONCE PER BOT, not continuously - its patch is a postfix on
# `BotOwner.method_10`, which runs on the activation path only. So:
#
#   * the flag IS armable without QuestingBots. Raid 1.5 proves it directly: no
#     QB in `agents.mods`, flag true, 96% of the roster asleep. The grant came
#     from our InitPoints postfix, once per bot at activation.
#   * with QB, TryReclaimStandBy is the granting route instead - but still once
#     per bot, because reclaim is gated `!CanDoStandBy` and a granted flag is
#     never revisited.
#   * either way it is a ONE-WAY LATCH and cannot be revoked mid-raid.
#
# So this raid is NOT "the only configuration in which the exempt-role question
# can be answered within one raid". It answers it once, in one direction, and
# QuestingBots changes which code path grants rather than whether it can.
#
# Precision that cost the ABAB design: "armable" and "armable in both
# directions" are different claims, and I had collapsed them.
#
# ---------------------------------------------------------------------
# BLOCK LENGTH: 900 s, NOT 240
# ---------------------------------------------------------------------
#
# 240 s was chosen to fit four blocks of alternation while giving each block a
# four-minute awake-age span. With alternation gone (see the arms below) there is
# nothing to fit, so the constraint disappears and block length costs only raid
# time. 900 s gives ~15 windows per arm at `Window seconds` = 60 against Delta's
# power calc of 4, and a fifteen-minute age span - which is the range the ramp
# actually needs, since it took roughly ten minutes to triple.
#
# `@seconds` warns at load if a box is not a whole number of windows, because a
# half window averages in as though it were a full one.
#
# ---------------------------------------------------------------------
# WHY A FIRST - NOW FORCED RATHER THAN CHOSEN
# ---------------------------------------------------------------------
#
# A is the SHIPPED DEFAULT: `Force for all roles = false`, so exempt roles stay
# awake continuously. B makes every role sleepable.
#
# A first WAS a choice - the ramped baseline before anything resets it. It is now
# a constraint: the latch means A-after-B is not a state this build can enter, so
# the only ordering that measures anything is A then B. Recorded as forced rather
# than left looking like a preference, because the next person to edit this file
# needs to know reordering it produces one arm and a mislabel.
#
# THE FREE PREDICTION IS GONE WITH THE ALTERNATION. This section previously
# claimed the SECOND A block should ramp from a lower base than the first, and
# called that a direct test of the awake-age reading. There is no second A block
# now, and there could never have been a meaningful one - the bots in it would
# have kept their grants and been asleep. **That prediction would have been
# scored against a block that was B in all but name, and it would have "confirmed"
# the age reading by construction.** It is the fails-toward-its-hypothesis shape,
# and the latch is the only reason it was caught before the raid rather than
# after.
#
# The awake-age reading therefore still rests on raid 1 vs raid 1.5, which is
# between-leg. Naming that as an open weakness rather than carrying a test that
# could not have failed.
#
# ---------------------------------------------------------------------
# THE ESTIMAND IS THE WITHIN-BOT AGE SLOPE. "Per-bot" is not enough.
# ---------------------------------------------------------------------
#
# Awake-age is a per-bot trajectory and arms alternate on a clock, so a bot does
# not reset when the box does. Cutting per-bot cost on ARM would put mixed-age
# bots in both arms and reproduce the raid-age confound one level down - the one
# that inverted a p75 headline on 2026-07-29.
#
# **BUT "SCORE AGAINST AGE" IS ALSO NOT ENOUGH, AND POOLED-WITH-AN-AGE-COLUMN IS
# THE CONFOUND WEARING THE FIX'S CLOTHES.** The two arms wake DIFFERENT
# POPULATIONS: A keeps exemption roles awake, whose fresh-call cost is ~0.034,
# while B wakes transients near the player at ~0.014. That level gap of 0.020 is
# about 30% of the entire ramp (0.068). So in a pooled regression the A-arm bots
# are both OLDER and from the PRICIER population, and composition manufactures
# up to a third of the apparent age effect.
#
#     estimand:  the WITHIN-BOT age slope - bot fixed effects, one trajectory
#                per individual
#     separately: cross-bot LEVEL differences, tagged by role
#
# Delta's form: the relation is estimated within bot from (age, ms) pairs, so
# every window is an observation regardless of arm, and "the arms share bots at
# different ages" stops being a defect and becomes the data.
#
# ONE CLAUSE OF "NEVER AGAINST ARM" IS TOO STRONG. The arm contrast is still the
# right analysis for the INTERVENTION question - what `Force for all roles` buys
# on p50 and p75, which is also on the docket. Two questions, two analyses, one
# raid. Neither substitutes for the other.
#
# ---------------------------------------------------------------------
# THE ARM IS ASSIGNMENT. THE RESET IS THE DOSE. GEOGRAPHY DECIDES WHO GETS IT.
# ---------------------------------------------------------------------
#
# Sleep is distance-gated at 150 m with a 30 s post-damage grace. **An exempt bot
# near the player, or recently engaged, does NOT sleep when the arm flips.** So a
# B block delivers its reset only to whichever exempt bots happen to be far away
# at the time.
#
# This is the same distinction that bit raid 1, where `Minimum brains per frame`
# set the dose while the log recorded a period change. **There it was a clamp;
# here it is geography.** So:
#
#   - score REALIZED per-bot transitions, never the arm flag
#   - a B block spent camping near the exemption set delivers NO DOSE and must
#     be read as UNDOSED, not as a null
#
# The 5 s `CheckInterval` propagation is the small end of this. The geographic
# gate is the big end.
#
# ---------------------------------------------------------------------
# WHICH SETTINGS CAN BE ARMED AT ALL - and it is not all of them
# ---------------------------------------------------------------------
#
# **Until 1ad93f4 the three DISTANCE settings could not be armed from a protocol,
# and every window's `cfg` would have insisted otherwise.** `Sleep distance`,
# `Wake distance` and `Posted role sleep distance` were stamped onto a bot exactly
# once, in `BotStandByInitPointsPatch`, so a mid-raid change reached only bots that
# activated afterwards - close to a no-op on a map whose population spawns early -
# while `cfg` reported one uniform number for the whole window.
#
# **We would have run the arm, measured nothing, and had the log agreeing with us.**
# Gamma spotted the once-only stamp; the consequence for arming was sharper than
# the comment they were writing.
#
# **This is the third coat of one shape**: raid 1's `Minimum brains per frame`
# setting the dose while the log recorded a period change; the geographic gate
# above deciding who receives a reset the arm only assigns; and now a setting that
# is written once while the log reports it per window. **The log records what was
# ASKED FOR; something else decides what happened.** Caught before this raid rather
# than in its analysis, which is the first time out of three.
#
# Fixed: the distances are re-applied every check interval, so they converge within
# one interval and are genuinely live. **So the `CheckInterval` note above now
# covers more than the wake check** - distances converge on the same 5 s clock.
# Still 2% against a 240 s box, and still not negligible below about 60 s.
#
# **`Force for all roles` IS NOT SYMMETRIC WITH THE DISTANCES and deliberately so.**
# It did not get the same per-interval treatment: reclaiming a cleared flag is
# `TryReclaimStandBy`'s job, and that refuses for roles the database exempts.
# Forcing it per interval from the init hook would override
# `BotsPatrolGeneratorGameEvent`'s scripted pauses with no way to opt out. So the
# flag remains live ONLY through the reclaim path - **which is exactly why this raid
# needs QuestingBots, and that dependency is unchanged.**
#
# Nothing in the arms below was affected. What changed is that a role-DISTANCE arm
# is now a real option for a later raid rather than a silent no-op.
#
# ---------------------------------------------------------------------
# THE FREE PREDICTION HAS THREE BRANCHES, NOT ONE
# ---------------------------------------------------------------------
#
# "The second A block ramps from a lower base" tests RESET versus FREEZE - not
# the age reading itself. All three registered before the raid, because the
# middle branch is the one that gets misread:
#
#   second base LOWER          sleep RESETS the accumulator. Full stand-by
#                              benefit, recycling is doing real work.
#   second base ~= first END   sleep FREEZES it. **The age reading is ALIVE and
#                              CONFIRMED**, and the recycling benefit is ~zero.
#   no ramp in either A block   raid 1's ramp was content or engagement, not
#                              age. The age reading is dead.
#
# **Without the middle branch written down, "base not lower" will be read as
# refuting the age reading when it CONFIRMS accumulation.** That is the
# dropBelowRange lesson returning in a new coordinate.
#
# Freeze also changes this design's reach: under freeze, ages accumulate ACROSS
# A blocks (4 + 4 min), so the raid sees older bots than under reset.
#
# ---------------------------------------------------------------------
# DELTA'S DISCRIMINATOR - free from this raid, no design change
# ---------------------------------------------------------------------
#
# REGISTERED BEFORE THE RAID. If whatever accumulates grows per BRAIN TICK, then
# B's bots age about 5.9x slower and per-bot trajectories DIVERGE BY ARM. If it
# grows per SECOND, they do not.
#
#     trajectories diverge by arm  -> the accumulator is on the ticked path
#     trajectories do not diverge  -> it is off the ticked path
#
# Either outcome localises it, from the same raid, at no extra cost. What I had
# called a contamination of the arms is the second-best result available here.
#
# ---------------------------------------------------------------------
# THIS RAID IS GATED ON AN INSTRUMENT THAT IS NOT CONFIRMED SHIPPED
# ---------------------------------------------------------------------
#
# Every clause above consumes **per-bot awake-age plus per-bot UpdateManual ms**.
# That is agreed with Beta and NOT confirmed in the build. Do not run this raid
# until it is, and falsify it before trusting it:
#
#   (a) age actually RESETS across un-pause -> pause -> un-pause
#   (b) per-bot ms SUMS to the pooled `updateManual.awakeMs`
#
# **(a) is not optional bench hygiene. A counter that silently froze would
# manufacture the freeze signature in branch 2 above** - so the instrument error
# and the middle branch are the same observation, which is the worst alias
# available here.
#
# ---------------------------------------------------------------------
# SUBTRACT `deadCalls` BEFORE QUOTING ANY PER-BOT COST FROM THIS RAID
# ---------------------------------------------------------------------
#
# `BotsClass.UpdateByUnity` walks its set and calls `UpdateManual()` on every bot
# with **no liveness test** - the guard is inside `UpdateManual`, so our postfix
# has already run by the time it fails. And a corpse keeps
# `StandByType_1 == active`. **So a dead bot reads as AWAKE, at near-zero cost,
# for as long as it stays on the roster.**
#
# Found because a component-census subject showed `alive: false` with
# `standBy: "active"` ten seconds after death, and Beta traced it to the walk.
#
# **For `awakeAge` this was an INVERSION rather than a dilution, and it is fixed
# in 86407a4.** `Ended()` drops a bot on death, so `Record` re-stamped the corpse
# at age 0 and piled near-zero costs into the YOUNGEST bucket - **manufacturing
# the exact shape of the finding the instrument exists to test, out of corpses.**
# Corpses are excluded now: a corpse has no continuous-awake age.
#
# For `updateManual` no existing field changed - the ticks stay where they were
# and `deadCalls` counts them as a **subset of `awakeCalls`**, so every log in the
# corpus keeps the meaning it had. Which means: **subtract `deadCalls` from
# `awakeCalls` before dividing.** QuestingBots raises the body count, so the
# correction is LARGER here than in raid 1.
#
# WHICH CORPSE FIELD ANSWERS WHICH QUESTION - and getting this backwards would
# produce a zero that reads as an all-clear.
#
#     deadAwake   a ONE-SHOT roster sample at window end. It settles the
#                 STEADY-STATE claim only. Against a sub-window transient it reads
#                 non-zero only if the sample happens to land inside the residency,
#                 so **deadAwake ~ 0 is the PREDICTED value and confirms nothing
#                 about the transient.**
#     deadCalls   INTEGRATES over every call in the window, so it is the one that
#                 prices a transient - and the only one of the two that can fail.
#
# I had told Sophia `deadAwake` was the field that closes the transient question.
# **It cannot.** Delta caught it: deadAwake-for-the-transient is a check that cannot
# fail, which is this project's own named defect class applied to the newest
# instrument on the day it shipped. Registered for this raid: **deadAwake identically
# 0 and deadCalls approximately 0.** Either reading non-zero and SUSTAINED reopens
# the question for QuestingBots' bot lifecycle specifically, since QB touches exactly
# the code that must be doing the removal - and at that point Beta's subtraction stops
# being confirmatory and becomes load-bearing.
#
# AND IT IS A THIRD CANDIDATE FOR THE 0.37-VERSUS-0.22 LEVEL GAP. Raid 1.5 ran
# three times longer with more deaths and read 6-10x cheaper per call. Corpse
# dilution grows with body count and elapsed time, which is the right direction
# for the LEVEL difference between the two raids - though not for the within-raid
# ramp, so it is a candidate rather than the answer. **So "both numbers were right
# and per-bot cost is a function of awake-age" is now provisional**: some of that
# level gap may be corpses. `deadCalls` decides it from this raid rather than
# leaving it arguable.
#
# ---------------------------------------------------------------------
# WHAT THIS RAID CANNOT ANSWER, so nobody promises it
# ---------------------------------------------------------------------
#
# **QuestingBots recycling keeps awake-ages YOUNG.** That is exactly what makes
# these arms clean, and it also starves the long-age tail. So this raid buys the
# young-age region plus the per-tick discriminator, and NOT the old end of the
# age-cost curve.
#
# The old end is what role-aware sleep distance would pay, because its bots are
# awake permanently by construction. Pricing that needs ONE RAID ON THE SHIPPED
# DEFAULT CONFIG with the awake-age counter running - which is a raid Sophia
# would run anyway, since raid-1 config IS the default.
#
# Do not quote a role-aware price off this raid.
#
# **AND THE LONGER BOXES MUST NOT READ AS HAVING BOUGHT THE FULL CURVE.** Under
# RESET the maximum observable age here is about four minutes - one block. 240 s
# was chosen to buy age RANGE within the young region, not to reach the old end.
# Only under FREEZE do ages accumulate across blocks, and which regime holds is
# the very thing branch 2 above decides. So the reach of this raid is not known
# until its own result is in.
#
# ONE MORE DIFFERENCE TO CARRY WHEN COMPARING RAMPS: QuestingBots MOVES bots. So
# an A block here is raid 1's ROLES plus QuestingBots' MOTION - not raid 1's
# baseline. Any ramp comparison against raid 1 is across a mod-set difference and
# must say so.
#
# ---------------------------------------------------------------------
# BEFORE LAUNCH
# ---------------------------------------------------------------------
#
#   QuestingBots installed, BOTH halves - the client plugin AND the server mod.
#   agents.mods reads the BepInEx Chainloader, so it can only see the client
#   half. A missing server mod gives bots that spawn and do not quest, and the
#   telemetry would report a clean QuestingBots run.
#
#   Reclaim stand-by from QuestingBots = true. Without it the arms are inert,
#   because reclaim is what re-reads the flag.
#
#   Run tag = raid2-questingbots
#
#   Brain update period = 0 throughout. This raid does not test slicing, and a
#   second knob moving is a confound.

name = raid2-questingbots-forceallroles

# --- PRECONDITION, and it was unmet for the whole time this file existed ------
#
# QuestingBots is NOT INSTALLED and never has been in the life of this corpus:
# `agents.mods` reads ["BigBrain","SAIN","LootingBots"] in all 24 logs, and on
# 2026-07-30 `ls BepInEx/plugins` confirmed no client dll and `SPT/user/mods`
# no server mod. The only thing on disk carrying the name is a stale
# `BepInEx/config/com.danw.questingbots.cfg` from an earlier install.
#
# This file was designed across eight hours by three agents reasoning from
# source in `Community\SPTQuestingBots-master`, which is source only. Every one
# of those readings was correct about the source and irrelevant to the machine.
#
# WHAT WOULD HAVE HAPPENED IF IT RAN: `cfg.forceAllRoles` would have flipped
# cleanly in every window and the arms would have been near no-ops on the
# population that matters. Without a clearing mod `ModCompat.ClearsStandByFlag`
# is false (ModCompat.cs:123, `QuestingBots || Orbit`), `TryReclaimStandBy`
# returns on its first line, and the sole writer of the grant is the InitPoints
# postfix - once per bot, at activation. So arm assignment becomes SPAWN-time
# rather than arm-time, and on Lighthouse the garrison is fixed during warm-up.
# **The config line is not evidence the lever moved.**
#
# The primary is unmeetable rather than failed: it is an EVENT criterion -
# `bots.asleep` above 0 WITH QuestingBots in `agents.mods` - and without the mod
# it can be neither satisfied nor refuted. The raid would return no verdict on
# the thing it exists for.
@requires questingbots

# `harness/check-mod-preconditions.py` reads that line and checks the DISK, both
# halves, exiting 1 when a declared mod is absent. Written because `ls plugins`
# would have caught this at any point in the preceding eight hours and none of
# the instruments we own was pointed at the install.

@seconds 240

# --- Excluded. Hold position while the map settles. 3 windows. -------
#
# Not instrument warmup. Raid 1.5's opening ran the fastest 60 s of the raid
# with bots unengaged - a real state with real variance, held and labelled
# rather than trimmed afterwards.
[WARMUP]
@seconds 180
Force for all roles = false
Brain update period = 0

# --- TWO measurement blocks, 900 s each. NOT ABAB. ------------------
#
# THIS WAS ABAB UNTIL 2026-07-30 AND ABAB DOES NOT WORK. Beta verified from the
# write sites and I re-verified from the decompiled source:
#
#   `BotOwner.method_10()` is called from exactly two sites, EFT/BotOwner.cs:1878
#   and :1885, BOTH inside `if (BotState == EBotState.PreActive && ...)`, and it
#   sets `BotState = EBotState.Active` at :1784. So it runs ONCE PER BOT, on the
#   activation path. QuestingBots' clearing patch is a postfix on it, so QB
#   clears `CanDoStandBy` once per bot and never again.
#
#   Our reclaim is gated `if (!CanDoStandBy && !TryReclaimStandBy(...))` at
#   BotStandByUpdatePatch.cs:125, so once the flag is granted it is never
#   revisited.
#
# Therefore `Force for all roles` is a ONE-WAY LATCH, with QuestingBots as well
# as without it. Flipping it false revokes nothing: bots granted in B keep the
# grant for the rest of the raid. A second A block would be B wearing an A
# label, and on Lighthouse the garrison is present from the start so almost no
# bot activates late enough to see it.
#
# THE LATCH FORCES THE ARM ORDER. A must come first, because A-after-B is not a
# state this build can enter. There is no design freedom here to get wrong.
#
# WHAT THIS COSTS: the replication. ABAB's whole point was separating "the knob
# did it" from "something drifted", and one A->B transition cannot. Read the
# limitation before the result:
#
#   Arm is now PERFECTLY CONFOUNDED WITH RAID AGE, and raid age is not inert -
#   raid 1's `updateManual` awake ms/call climbed monotonically, rho +0.918 over
#   13 windows. B is always the later block, so the ramp is inside the contrast.
#
#   The direction is what makes this tolerable: the ramp makes things WORSE with
#   elapsed time, and B is later, so the drift works AGAINST B. A B that wins
#   anyway wins by at least the measured margin. **This design can confirm a
#   benefit and cannot bound one** - if B ties or loses, raid age is a live
#   explanation and the raid says nothing.
#
# THE INSTRUMENT GATE, so the design does not rest on the reasoning above:
# `bots.standByBlocked` must be NON-ZERO across the A block. Beta's rule -
# near-zero across a `false` stratum is the latch, not compliance. If A reads
# near-zero, A never happened and no contrast may be quoted from this raid.
# That check fails toward refusing the result, which is the direction it should.
#
# 900 s per arm gives ~15 windows at `windowSeconds = 60`, against Delta's power
# calc of 4 per arm. Longer blocks are free here: with only one transition there
# is nothing to alternate, so block length costs nothing but raid time.

[A]
@seconds 900
Force for all roles = false

[B]
@seconds 900
Force for all roles = true

# Stand-down. Not a measurement block. Advance() writes ConfigEntry.BoxedValue
# and nothing restores it, so a raid ending on B leaves every role sleepable in
# memory and the next raid runs under a setting nobody chose. Press on
# extraction; the box is short so it cannot swallow the extract.
[standdown]
@seconds 60
Force for all roles = false
