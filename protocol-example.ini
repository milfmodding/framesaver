# Framesaver measurement protocol.
#
# Copy to  BepInEx\config\framesaver.protocol.ini  to arm it. Read at RAID START,
# so editing it takes effect on the next raid rather than the next launch.
#
# Press the protocol key (default Ctrl+Alt+PageDown) to advance one step. Each press:
#   1. applies that step's config values
#   2. closes the current telemetry window immediately
#   3. stamps the step's label onto every line after it
#
# The window the press cuts short is marked "flushedByProtocol": true and is a PARTIAL
# window - shorter than a whole one. Do not average it in. It is marked rather than
# suppressed, because the contaminated interval is sometimes the one you want to see.
#
# Keys are BepInEx setting names exactly as they appear in framesaver.ai.perf.cfg,
# spaces and all. An unknown key or an unparseable value REFUSES THE WHOLE PROTOCOL
# and says why in the BepInEx log - a typo that silently did nothing would produce an
# arm whose config never changed, which in the data is indistinguishable from a knob
# that had no effect. That is the exact conclusion an A/B exists to draw.

name = gc-slice-ABA

# Arm 1: control. Nothing set - an empty step is legal and still stamps its label,
# which is how you get a labelled baseline without touching anything.
[A1]

# Arm 2: the knob under test.
[A2]
GC time slice ms = 6

# Arm 3: back to control. A1 vs A3 is the replication that separates "the knob did it"
# from "something drifted over nine minutes" - heat, a bot wave arriving, the heap
# growing. The between-arm delta must beat the A1-A3 delta for the run to be readable.
[A3]
GC time slice ms = 0
