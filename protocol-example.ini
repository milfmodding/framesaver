# Framesaver measurement protocol - FORMAT REFERENCE.
#
# Copy to  BepInEx\config\framesaver.protocol.ini  to arm it. Read at RAID START,
# so editing it takes effect on the next raid rather than the next launch.
#
# This file documents the format and is meant to be copied and gutted. The real
# protocols live beside it as protocol-<question>.ini, and those are worth
# reading for how a question becomes a set of arms.
#
# =====================================================================
# THE FORMAT IN FULL. A protocol file contains exactly three things.
# =====================================================================
#
#   [Label]            starts a step. The label is stamped onto every telemetry
#                      line while that step runs, as protocol.arm.
#
#   Setting name = v   sets one BepInEx setting for that step. The key is the
#                      setting name exactly as it appears in the .cfg, spaces
#                      and all.
#
#   @directive = v     instructs the RUNNER rather than the mod.
#
# Directives are @-prefixed so they can never collide with a setting name. If a
# setting called "seconds" is ever added, every protocol file on disk keeps
# working. (Bare `name` is also accepted; it predates the prefix.)
#
# ---------------------------------------------------------------------
# THE DIRECTIVES
# ---------------------------------------------------------------------
#
#   @name = my-experiment
#       Names the run; appears on every line as protocol.name. Set it before
#       the first [step].
#
#   @seconds = 120
#       How long a step runs before advancing ITSELF. Before the first [step]
#       it is the default for all of them; inside a step it overrides for that
#       step only. Omit it, or set 0, and that step waits for the key.
#
#       MAKE IT A WHOLE NUMBER OF TELEMETRY WINDOWS - at the default 60 s
#       window, 60 / 120 / 180. A 90 s box gives one full window and one half
#       window, and the half averages in as though it were the same size. The
#       runner warns in the BepInEx log; it does not refuse, because sometimes
#       you mean it.
#
# ---------------------------------------------------------------------
# HOW STEPS ADVANCE
# ---------------------------------------------------------------------
#
# The FIRST step always needs the key. After that, any step with a box advances
# itself. That split is deliberate: the press at raid start is made calmly, and
# the presses that get missed are the ones during a fight.
#
# The key (default Ctrl+Alt+PageDown) always works, boxed or not, so an arm can
# be cut short or skipped.
#
# Every advance, timed or pressed:
#   1. closes the current telemetry window immediately
#   2. applies that step's config values
#   3. stamps the new label onto every line after it
#
# In that order. The window closes BEFORE the config changes, so the closing
# line describes the arm that just ended rather than the one about to start.
#
# The window an advance cuts short is marked "flushedByProtocol": true and is a
# PARTIAL window - shorter than a whole one. Do not average it in. It is marked
# rather than suppressed, because the contaminated interval is sometimes the
# one you want to see. A fully boxed protocol produces few of these, which is
# most of the reason to box.
#
# Every line also carries protocol.stepSeconds - the box in force, or 0 if that
# arm was advanced by hand. So a log can say whether its arm boundaries were
# timed or thumbed, which matters the moment you want to claim two arms covered
# the same stretch of raid.
#
# ---------------------------------------------------------------------
# WHEN IT REFUSES
# ---------------------------------------------------------------------
#
# An unknown setting name, an unparseable value, or an unknown @directive
# REFUSES THE WHOLE PROTOCOL and says why in the BepInEx log. Nothing is
# half-applied.
#
# Worth internalising before writing your own: a typo that silently did nothing
# would produce an arm whose config never changed, which in the data is
# indistinguishable from a knob that had no effect - the exact conclusion an
# A/B exists to draw. A protocol that refuses costs a raid. A protocol that
# silently no-ops costs a conclusion.
#
# Decimals are always invariant - `0.5`, never `0,5`, whatever your locale.
#
# =====================================================================
# A WORKED EXAMPLE
# =====================================================================

@name = gc-slice-ABA
@seconds = 120

# Not a measurement arm. Let the map settle and the heap reach steady state
# before anything is scored. Longer than the others on purpose, which is what a
# per-step @seconds is for.
[warmup]
@seconds = 180
GC time slice ms = 0

# Arm 1: control. An empty step is legal and still stamps its label, which is
# how you get a labelled baseline without touching anything.
[A1]

# Arm 2: the knob under test.
[A2]
GC time slice ms = 6

# Arm 3: back to control. A1 vs A3 is the replication that separates "the knob
# did it" from "something drifted over nine minutes" - heat, a bot wave
# arriving, the heap growing. The between-arm delta must beat the A1-A3 delta
# for the run to be readable.
#
# Interleave rather than block if the steps are affordable: A1 A2 A1 A2 crosses
# arm with elapsed time instead of confounding them. Either way the control and
# the treatment should cover the same stretch of raid. A raid is a different
# machine at minute two and minute thirty, and an arm that only ever ran early
# is not comparable to one that only ever ran late - that mistake has already
# cost this project a headline result.
[A3]
GC time slice ms = 0

# Stand-down. NOT a measurement arm, and not optional.
#
# Advancing writes the setting live and nothing restores it, so a raid that
# ends on a treatment arm leaves that value in memory and every later raid in
# the session runs silently treated. End every protocol by putting the knobs
# back. Left unboxed so it does not fire on its own - press it on extraction,
# or simply let the raid end on it.
[standdown]
@seconds = 0
GC time slice ms = 0
