# Brain-slicing A/B. Streets, held position, interleaved blocks.
#
# Copy to  BepInEx\config\framesaver.protocol.ini  to arm it. See
# protocol-example.ini for how the runner works; this file only records
# what THIS protocol tests and the one thing that must be true before it
# means anything.
#
# ---------------------------------------------------------------------
# BEFORE YOU LAUNCH: `Defer to other AI mods` must be false.
# ---------------------------------------------------------------------
#
# DrakiaXYZ-BigBrain.dll is installed (SAIN depends on it). ModCompat
# suppresses slicing whenever BigBrain or ORBIT is present and the defer
# setting is on - so with the shipped default, setting the period below
# does NOTHING and the log still reports the period you asked for. The
# arm would read as applied and be vanilla underneath.
#
# That is why the override lives in framesaver.ai.perf.cfg and not in a
# step here: it has to be false before ModCompat latches its detection,
# which happens on the first bot-brain frame - long before you can press
# the key. Set there, BepInEx logs "no compatibility guards will be
# applied", and Player.log carries the proof the arm was real.
#
# ---------------------------------------------------------------------
# WHY SIX BLOCKS AND NOT THREE
# ---------------------------------------------------------------------
#
# A single ABA reversal confounds arm with time on this metric. Gamma
# measured spike counts rising 3.9x from the first half of a raid to the
# second AT CONSTANT CONFIG, rho +0.71 against window order. Under a
# monotonic drift like that, the late control sits above the early one
# whatever the knob does, and the treatment arm in the middle lands
# between them either way. ABA can DETECT that drift and cannot separate
# it from the effect.
#
# Interleaving gives three replications of the contrast, each spanning
# four minutes instead of one spanning fifteen, so drift falls on both
# arms roughly equally. It also balances exposure 50/50 rather than the
# 2:1 control-heavy split ABA produces, which is the more powerful
# allocation for detecting a difference.
#
# Two minutes per block, not 2.5: `Window seconds` is 60, so two minutes
# is exactly two whole windows and the press lands on a boundary. At 2.5
# the press cuts the third window short and 20% of held time lands in
# partials that must be excluded. Precision is not critical either way -
# block identity comes from `protocol.step`, not from the clock.
#
# Labels repeat on purpose. `arm` names the CONDITION, so pooling the
# three B1 blocks is what the label already does; `protocol.step` names
# the BLOCK when you need to tell them apart. The alternative - B1a,
# B1b, B1c - forces every reader to string-munge before pooling.
#
# Every block states its own value rather than leaving a step empty. An
# empty step inherits whatever is on disk, so a leftover value from a
# previous session would make a control an arm 2 wearing arm 1's label.

name = brain-slice-interleaved

# --- Held position. Press every ~2 minutes. -------------------------

[B1]
Brain update period = 0

[B2]
Brain update period = 0.1

[B1]
Brain update period = 0

[B2]
Brain update period = 0.1

[B1]
Brain update period = 0

[B2]
Brain update period = 0.1

# --- Then go fight. -------------------------------------------------
#
# Slicing on, then Kaban's crew at LexOs. A seventh step exists because
# after the sixth press Advance() refuses - the protocol is finished and
# nothing changes. Without it the only way to get slicing back on for
# the fight is the F12 overlay, which is the straddle problem this whole
# mechanism exists to avoid.
#
# Labelled distinctly rather than B2 because it MUST NOT pool with the
# held blocks: different position, firefight in it, and absolute ms do
# not transfer across either. Its control is Sophia's own repeated
# unsliced runs of the same fight - a historical control, and one that
# cannot be replicated in-raid, because killing Kaban's crew once leaves
# no second fight to reverse into.
[KABAN]
Brain update period = 0.1
