# Framesaver protocol - anim cull on STREETS. Second map, first ABBA design.
#
# Copy to  BepInEx\config\framesaver.protocol.ini  to arm it.
# Format reference is protocol-example.ini.
#
# NOT ARMED. Written 2026-08-07 by Framesaver/Beta. Deploying and arming are
# separate acts and neither is done here.
#
# ---------------------------------------------------------------------
# DO NOT RUN THIS ON 2026-08-07. USE protocol-anim-cull.ini UNCHANGED.
# ---------------------------------------------------------------------
#
# I recommended this file for the Streets raid and WITHDREW that within two
# minutes, because Gamma measured the thing this file's own caveat said was
# unmeasured. Left in place rather than deleted: it is the template for the
# remaining maps and the reason it was not run tonight is the most useful
# thing in it.
#
# THE SHORT VERSION, AND IT WAS REVISED TWICE IN FIVE MINUTES - read the
# final form rather than the first, because the first is what I posted:
#
#   1. The drift is not linear. Measured curvature is large.
#   2. ABBA cancels linear drift exactly and does NOT cancel curvature, and
#      it seats the CONTROL arm at both extremes, so under smooth convexity
#      its residual bias runs in the direction that FLATTERS the cull.
#   3. BUT the shape actually measured is better described as FLAT-THEN-STEP
#      than as a parabola, and a second difference cannot tell those apart.
#      ABBA cancels a step EXACTLY, wherever the step falls.
#   4. AND ABBA's bias is SMALLER THAN ABAB's IN MAGNITUDE ON EVERY SHAPE
#      TESTED - 0.000 vs -1.000 linear, +2.000 vs -7.000 quadratic,
#      +21.000 vs -52.000 cubic, 0.000 vs 0.000 on a step.
#
# SO DO NOT READ THIS FILE AS "ABBA WAS A MISTAKE." It is the better design
# on every shape anyone has measured. What was wrong was my recommending it
# for a raid HOURS BEFORE IT WAS DEPENDED ON, on an assumption I had flagged
# as untested and then relied on anyway. THAT is why tonight uses the old
# file, and the reason is scheduling discipline rather than design merit.
#
# BEFORE THIS FILE IS RUN ON ANY MAP, the third-visit requirement below must
# be satisfied. It is not satisfied by the arms as currently written.
#
# =====================================================================
# READ THIS FIRST: THIS FILE'S DENOMINATOR IS EVERY MAP, NOT THIS RAID
# =====================================================================
#
# Sophia, 2026-08-06: "I want to get at least one proper run on every map with
# a correct protocol now that we know what that should look like."
#
# So this is a TEMPLATE that will be copied six or seven more times, and a
# defect in it multiplies rather than gets caught. It is deliberately longer
# than tonight alone justifies.
#
# TO REUSE ON ANOTHER MAP: change nothing except the @name. Every arm below is
# map-independent by construction. The two places a map name appears are this
# banner and @name, and that is on purpose.
#
# =====================================================================
# WHAT CHANGED FROM protocol-anim-cull.ini, AND WHY
# =====================================================================
#
# Two changes. Both come from measurements taken on the Lighthouse log
# (framesaver-20260804-234333-anim-cull-ab.ndjson) on 2026-08-06, and neither
# is a matter of taste.
#
# --- CHANGE 1: ABBA ORDER, NOT ABAB. This is the important one. ---
#
# reg-unc-2026-08-06T082951.
#
# In the Lighthouse run the A arm preceded its B partner in ALL THREE pairs:
#
#     A1 t=305s   B1 t=425s
#     A2 t=545s   B2 t=665s
#     A3 t=785s   B3 t=905s
#
# And there is a large drift, monotone in raid progression, in a term the
# animator cull does not touch. Update/ScriptRunBehaviourUpdate - ordinary
# MonoBehaviour Update() - runs 4.0 ms early and 10.4 ms late. It is 45.9% of
# the A3-A2 frame excess of +10.841 ms; the animation phase is 17.1%.
#
# WITH A ALWAYS EARLIER AND THE DRIFT UPWARD, EVERY A-MINUS-B CONTRAST IS
# BIASED THE SAME DIRECTION. It is BIAS, NOT VARIANCE - more windows and more
# pairs buy more precise estimates of a shifted quantity. That is why the two
# clean Lighthouse pairs disagreed in SIGN on frame time while the animation
# phase contrast did not:
#
#     paired A-B, cull OFF minus ON:
#       AnimBegin   +2.762  +1.781  +3.727    consistent - the cull
#       ScriptUpd   +0.549  -2.212  +1.955    sign flips  - the drift
#
# THE FIX, AND THE ARITHMETIC SO A LATER READER CAN CHECK IT RATHER THAN
# TRUST IT. Let d be the drift accumulated over one arm length. In an A-then-B
# pair the measured contrast carries -d; in a B-then-A pair it carries +d. Run
# them in blocks of four as A B B A and the block holds one of each, so under
# a LINEAR drift the two biases cancel exactly in the block mean.
#
#   block:      A    B    B    A
#   pair 1:     ^----^              A first  -> bias -d
#   pair 2:               ^----^    B first  -> bias +d
#                                   block mean bias = 0
#
# THE LIMIT IS NOT A CAVEAT ANY MORE. IT IS A MEASURED DEFECT.
#
# This cancels LINEAR drift. When this file was written nobody had measured
# whether the drift is linear, and the paragraph here said so and moved on.
# Gamma then measured it, in one query, using the fact that last night's
# three control arms were EVENLY SPACED by accident - 243, 483, 723s, exactly
# 240s apart. Even spacing means a linear drift REQUIRES A2 == (A1+A3)/2, so
# the second difference A1 - 2*A2 + A3 is a curvature test that can fail.
#
#   quantity                      A1      A2      A3    curvature   % of level
#   frame.avg                 24.026  22.533  33.374     +12.334      +54.7%
#   Update/ScriptRunBehaviour  5.721   5.315  10.292      +5.383     +101.3%
#   animPhase (raw)            7.797   7.564   9.414      +2.084      +27.5%
#   animPhase PER AWAKE BOT    0.532   0.567   0.554      -0.049       -8.7%
#
# WHAT IS ESTABLISHED: THE DRIFT IS NON-LINEAR. Full stop. A non-zero second
# difference over three evenly spaced control arms refutes linearity and does
# nothing else. A linear model fitted on A1->A2 predicts A3's frame at 21.040
# ms against an actual 33.374 - IT MISSES BY MORE THAN THE ENTIRE EFFECT
# UNDER TEST.
#
# WHAT IS NOT ESTABLISHED: THE SHAPE. This was first written up as "convex",
# and that word was withdrawn by the person who measured it, unprompted,
# because A SECOND DIFFERENCE CANNOT TELL A PARABOLA FROM A STEP. The
# window-level data actually favours a STEP - flat at ~5.0-6.0 ms across the
# first four arms, then first-half mean 5.167 against second-half 8.935 with
# non-overlapping ranges, peaking at arm 6 and coming partly back at arm 7.
# That is a level shift, not a smooth curve.
#
# ***** WHY THE SHAPE IS THE WHOLE QUESTION FOR THIS DESIGN *****
#
# In the A B B A schedule below A sits at positions 1, 4, 5, 8 - both extremes
# of each block - and B at 2, 3, 6, 7, both interiors. The two candidate
# shapes have OPPOSITE implications for that:
#
#   shape        ABBA ABBA bias
#   linear            0.000    cancelled exactly
#   STEP              0.000    cancelled exactly, wherever it falls
#   quadratic        +2.000    NOT cancelled, and A absorbs more than B
#
# A IS THE CONTROL AND THE CULL BENEFIT IS A MINUS B, so an uncancelled
# quadratic residual INFLATES the apparent benefit - the direction that
# flatters the result we want, which is the direction nobody audits.
#
# SO: IF THE DRIFT IS A STEP, ABBA CANCELS IT EXACTLY AND THIS WHOLE CONCERN
# EVAPORATES. IF IT IS A SMOOTH CURVE, IT DOES NOT. NOBODY HAS ESTABLISHED
# WHICH, AND COMPARING THE TWO ABBA BLOCKS CANNOT ESTABLISH IT EITHER.
#
# DO NOT COMPRESS THE PARAGRAPH ABOVE. Its short form - "the drift is convex,
# so ABBA flatters the cull" - encodes a shape nobody has measured, and this
# file is going to be copied six more times. A handoff carries its wrong
# conclusions at maximum priority and cannot tell them from the right ones.
#
# ***** AND THE REQUIREMENT THAT FIXES IT, WHICH THE ARMS BELOW DO NOT MEET **
#
# ABBA gives TWO visits per arm type. Two points estimate a slope and leave
# ZERO degrees of freedom to test it - so ABBA removes a linear drift and
# CANNOT DETECT ITS OWN FAILURE. Last night knew better only by accident.
#
#   REQUIRED BEFORE THIS FILE RUNS: three EVENLY SPACED visits to the same
#   arm type, so the second difference is computable within the raid. That
#   is what makes curvature a measurement rather than an assumption, and it
#   costs nothing but scheduling.
#
# DO NOT USE BLOCK-VERSUS-BLOCK AGREEMENT AS A DRIFT DIAGNOSTIC. It was
# proposed, written into this file, and RETRACTED by its own author within
# four minutes when he computed it instead of asserting it. Bias in
# mean_A - mean_B from arm order alone, per unit of drift shape:
#
#   design                  linear     quad    cubic   step@mid  step@blk2
#   ABAB ABAB               -1.000   -7.000  -52.000      0.000      0.000
#   ABBA ABBA                0.000   +2.000  +21.000      0.000      0.000
#     block 1 alone          0.000   +2.000   +9.000      0.000      0.000
#     block 2 alone          0.000   +2.000  +33.000      0.000      0.000
#
# BOTH BLOCKS CARRY THE SAME QUADRATIC BIAS, +2.000 EACH, SO THEIR DIFFERENCE
# IS 0.000. Curvature is INVISIBLE to a block comparison: the two blocks agree
# WHILE BOTH ARE BIASED, which reads as "no drift problem" and is the worst
# failure a diagnostic can have. What block-vs-block detects is CUBIC - block
# 1 +9, block 2 +33 - which is CHANGING curvature, not curvature.
#
# THE DIAGNOSTIC THAT DOES WORK, free and analysis-only, and it works on the
# OLD file too: do not compare blocks. Fit the A-arm LEVELS against their
# TIMESTAMPS. In ABBA ABBA the A arms sit at positions 1, 4, 5, 8 - four
# visits at known times - so a fit has a degree of freedom left to test it
# with. THAT is a check capable of failing.
#
# --- CHANGE 2: ARMS ARE 150s, NOT 120s. Power, and it is needed here. ---
#
# Streets sleeps ~10.0 bots against Lighthouse's ~17.9 (mod-off marathon,
# per-map). THE CULL ACTS ON THE SLEEPING SET, so expect roughly half the
# effect and a noisier number than 33-34%. THAT WILL NOT MEAN THE EFFECT
# CHANGED, and anyone reading a smaller number here as a weaker cull is
# reading a power difference as a finding.
#
#   150s at a 30s window = 5 windows per arm, 4 scored after drop-partials.
#   8 scored arms x 4 = 32 scored windows, against Lighthouse's 18.
#
# 150 is an exact multiple of the 30s window, deliberately - see the
# drop-partials note below, which depends on it.
#
# WHY NOT LONGER ARMS INSTEAD OF MORE ARMS: arm length trades against the
# drift cancellation, because a longer arm means a larger d for the ABBA
# block to cancel and more room for curvature. Eight arms of 150s is the
# compromise; it is a judgement, not a derivation.
#
# TOTAL PROTOCOL TIME: 180s warmup + 8 x 150s = 1380s = 23 minutes, then
# standdown. IF THE RAID ENDS EARLY THE LATER ARMS ARE SIMPLY ABSENT - and a
# truncated run is still readable as whole ABBA blocks. READ BLOCK 1 ALONE
# RATHER THAN SIX ARMS OF BLOCK 1 PLUS TWO OF BLOCK 2: a partial block is
# unbalanced and reintroduces exactly the bias this design removes.
#
# =====================================================================
# WHAT THIS RAID IS FOR - AND THE HOLE IN IT IS MINE AND IS STATED
# =====================================================================
#
# reg-unc-2026-08-05T071956, registered by Beta BEFORE any of this existed.
#
# THE BET: the cull's saving comes from OFF-SCREEN culling rather than from
# roster size, so the saving should track the off-screen fraction across maps.
#
# THE TEST: compare, per raid and computed WITHIN raid, the check-3 ratio
# (animCulledOffScreen / animCulled) against the saving (A-B)/A on
# phases.PreLateUpdate/DirectorUpdateAnimationBegin.avg PER AWAKE BOT.
#
#   PREDICTION  a map with a materially lower ratio shows a materially
#               smaller saving.
#   REFUTED IF  a map with a materially lower ratio shows the same ~33%.
#               Then the saving is not off-screen culling and the mechanism
#               is wrong.
#
# THE HOLE, AND IT IS THE FIRST JOB OF THIS RAID: we have exactly ONE ratio
# measurement, on ONE map. Lighthouse read 0.870 / 0.917 / 0.926 - a range of
# 0.009, no variation at all. NOBODY KNOWS WHETHER ANY MAP PRODUCES A
# MATERIALLY LOWER RATIO.
#
#   So the first output of this raid is not the saving. It is the RATIO.
#   If Streets also reads ~0.9, THE BET IS UNTESTABLE RATHER THAN WRONG,
#   and that is a real answer that should be reported as one.
#
# I am recording that against myself in advance because the failure available
# here is reading "no refutation" as support. Escaping refutation on a design
# that could not have confirmed me is not vindication - which is the same
# error I made on Lighthouse, where I pre-registered three ways to LOSE and
# left the winning cell undefined.
#
# =====================================================================
# CHECK 3 HAS NO READER. THIS IS THE ONE THING THAT COULD WASTE THE RAID.
# =====================================================================
#
# `read-animcull.py` DOES NOT DEREFERENCE `animCulledOffScreen`. Verified
# 2026-08-07 by grep over the whole repo: the field appears in Telemetry.cs,
# SleepingBotAnimatorPatch.cs, BossGroupWake.cs, two analysis scripts, a
# fixture set and a crashtest that FABRICATES it - and in no reader.
#
# THE CONSEQUENCE IS NARROW AND WORTH GETTING RIGHT:
#
#   - the field IS emitted by the deployed build, so the DATA will be in the
#     log whether or not a reader exists
#   - what is missing is a GATE, not the measurement
#   - so the ratio must be computed directly from the ndjson, and the person
#     computing it must not expect read-animcull.py to have checked anything
#
# DO NOT READ A CLEAN read-animcull.py RUN AS CHECK 3 HAVING PASSED. It does
# not look at the field. It also passes a latched run identically to a clean
# one (reg-unc-2026-08-04T162202) and certifies arm delivery only.
#
# THE ANALYSIS SCRIPT FOR THE RATIO SHOULD BE WRITTEN AND FALSIFIED BEFORE
# THE RAID, not after. A reader written once the numbers are visible is a
# reader shaped by them.
#
# =====================================================================
# PRE-REGISTERED ANALYSIS RULES - FIXED BEFORE ANY NUMBER EXISTS
# =====================================================================
#
# These are binding. A rule chosen once the numbers are visible is an outcome
# wearing a rule's clothes (reg-dec-2026-08-05T065959, Delta's, and it binds
# me here).
#
# 1. PRIMARY DV: phases.PreLateUpdate/DirectorUpdateAnimationBegin.avg,
#    per awake bot, contrasted WITHIN pair.
#
#    NOT frame time. Frame time carries the drift above and is dominated by
#    ScriptRunBehaviourUpdate, which the cull does not touch. The animation
#    phase does not drift when the cull is ON - across the whole Lighthouse
#    raid it read 5.035, 5.782, 5.688.
#
#    Frame time MAY be reported as a secondary. It may not be the headline,
#    and a frame-time result that disagrees with the phase result is not a
#    tie to be broken by whichever is more interesting.
#
# 2. WINDOWS: drop every window with "flushedByProtocol": true, as primary.
#    Report all-windows beside it. n as a column in BOTH cuts.
#
#    THE PREMISE OF THAT RULE IS FALSE HERE AND IT IS KEPT ANYWAY. Arm boxes
#    are exact multiples of the window length, so flushed windows run
#    29.95-30.00s against a 30s box - 0.12% short, not partial in any sense
#    that matters. The rule discards 20% of every arm for a partiality that
#    does not exist, and on Lighthouse it cost 1.0 percentage point.
#
#    KEPT because Lighthouse was computed under it and THIS RAID'S WHOLE
#    PURPOSE IS A CROSS-MAP COMPARISON. Changing the window rule between the
#    two maps would put the change and the map in the same step. Report both
#    cuts; if they disagree that is the result, not a prompt to choose.
#
# 3. ROSTER ACROSS PAIRS IS AN OUTPUT, NOT A CHECK. Report mean bots.awake
#    per arm and the range across pairs as a first-class number.
#
#    On Lighthouse the roster was stable BETWEEN arms within a pair - so
#    paired contrasts were protected - and moved 27% BETWEEN pairs, so
#    cross-pair levels were not. Check 2 tested arm-type difference and
#    passed correctly; roster stability ACROSS pairs is a different property
#    and nobody tested it. Print it so it cannot go untested again.
#
# 4. THE BLOCK MEANS ARE REPORTED SEPARATELY before they are pooled. Two
#    ABBA blocks that disagree is information about drift curvature. Pooling
#    first destroys it.
#
# =====================================================================
# CROSS-MAP COMPARISON: WHAT THE README RULE DOES AND DOES NOT FORBID
# =====================================================================
#
# The README says NEVER COMPARE ACROSS MAPS. That rule is about LEVELS, and
# it is correct about levels - a ms figure from Streets and one from
# Lighthouse are not comparable and never will be.
#
# WITHIN-RAID EFFECT SIZES ARE A DIFFERENT OBJECT. (A-B)/A computed inside
# one raid, against a control measured in the same raid on the same machine
# in the same session, is exactly what reg-unc-2026-08-05T071956 compares
# across maps, and it is legitimate where a level comparison is not.
#
# WRITTEN HERE EXPLICITLY so the seventh person to copy this file does not
# meet the README rule, apply it to effect sizes, and conclude the whole map
# campaign is invalid. That is a foreseeable misreading and this paragraph
# is the entire defence against it.
#
# STILL FORBIDDEN, and unchanged: regressing this raid's LEVELS against the
# 25-log corpus. cullSleeping and standBy are perfectly confounded across all
# 22 prior mod-on sessions - both off-diagonal cells empty - so the corpus
# carries no information about the cull alone. reg-unc-2026-08-05T043355.
#
# =====================================================================
# THE THREE PINS, UNCHANGED FROM protocol-anim-cull.ini AND WHY THEY STAY
# =====================================================================
#
# Restated in every arm rather than set once, because a protocol advanced by
# hand can skip a step and an arm that does not restate its conditions is an
# arm you reconstruct from the one before it.
#
#   Skip sleeping bot LateUpdate = false
#     Player.VisualPass rewrites cullingMode on every call, which is what
#     makes the cull reversible. VisualPass has exactly ONE call site in the
#     assembly, inside Player.LateUpdate. Skipping LateUpdate for sleeping
#     bots suppresses the only thing that would UNDO the cull, so a bot
#     asleep at an arm boundary stays culled - arm B leaks into arm A. On a
#     map with ten sleeping bots that is most of the population. THIS MAKES
#     THE EXPERIMENT UNMEASURABLE, SILENTLY.
#
#   Skip sleeping bot world tick = false
#     Does not cause the latch, but removes real work of its own which would
#     ride along on whichever arm holds it.
#
#   Decouple cull from stand-by = false
#     With it ON the cull's eligible set becomes every live AI player instead
#     of `Sleeping`, so BOTH arms measure a different population and the
#     contrast still produces a clean plausible number with nothing saying
#     the denominator moved. MORE DANGEROUS THAN THE SKIPS, which fail
#     loudly. READ THE FLAG BACK OUT OF THE LIVE CONFIG AFTER DEPLOY -
#     "the default is false" and "the config says false" are different
#     claims and only the second one is checkable.
#
# =====================================================================
# BEFORE ARMING - the preconditions that are not in this file
# =====================================================================
#
#   - FORCE A REBUILD. The deploy gate compares the tree to HEAD and never
#     the binary to its source, and a stale binary from an earlier build of
#     the SAME commit carries a CORRECT provenance stamp. The csproj-level
#     guard Sophia ruled for (reg-dec-2026-08-06T063044) is NOT BUILT YET.
#   - Read `Decouple cull from stand-by` back out of the live config.
#   - Confirm the seven mod-off levers are still at shipping defaults; the
#     live config was found in mod-off lever state once already.
#   - Nothing else running on the box during scored arms.
#
# =====================================================================

@name = anim-cull-streets
@seconds = 150

# Not scored. Let the map load, the spawn wave land and the roster settle.
# Early windows have bots arriving, which moves bots.awake for reasons that
# have nothing to do with the arm.
[warmup]
@seconds = 180
Cull sleeping bot animators = true
Skip sleeping bot LateUpdate = false
Skip sleeping bot world tick = false
Decouple cull from stand-by = false

# ---------- BLOCK 1 : A B B A ----------
# A = cull OFF = the control.

[A1]
Cull sleeping bot animators = false
Skip sleeping bot LateUpdate = false
Skip sleeping bot world tick = false
Decouple cull from stand-by = false

[B1]
Cull sleeping bot animators = true
Skip sleeping bot LateUpdate = false
Skip sleeping bot world tick = false
Decouple cull from stand-by = false

[B2]
Cull sleeping bot animators = true
Skip sleeping bot LateUpdate = false
Skip sleeping bot world tick = false
Decouple cull from stand-by = false

[A2]
Cull sleeping bot animators = false
Skip sleeping bot LateUpdate = false
Skip sleeping bot world tick = false
Decouple cull from stand-by = false

# ---------- BLOCK 2 : A B B A ----------
# Same shape rather than mirrored. Two identically-shaped blocks make the
# block-to-block difference a clean read on drift curvature; mirroring them
# would confound curvature with order.

[A3]
Cull sleeping bot animators = false
Skip sleeping bot LateUpdate = false
Skip sleeping bot world tick = false
Decouple cull from stand-by = false

[B3]
Cull sleeping bot animators = true
Skip sleeping bot LateUpdate = false
Skip sleeping bot world tick = false
Decouple cull from stand-by = false

[B4]
Cull sleeping bot animators = true
Skip sleeping bot LateUpdate = false
Skip sleeping bot world tick = false
Decouple cull from stand-by = false

[A4]
Cull sleeping bot animators = false
Skip sleeping bot LateUpdate = false
Skip sleeping bot world tick = false
Decouple cull from stand-by = false

# Stand-down. Advancing writes settings live and nothing restores them, so a
# raid that ends on A leaves the cull OFF for every later raid this session -
# and the cull is ON by default, so that is a silent downgrade of the mod
# itself. BLOCK 2 ENDS ON A4, WHICH IS CULL OFF, SO THIS ARM IS LOAD-BEARING
# AND NOT TIDINESS. Press it on extraction, or let the raid end here.
[standdown]
@seconds = 0
Cull sleeping bot animators = true
Skip sleeping bot LateUpdate = false
Skip sleeping bot world tick = false
Decouple cull from stand-by = false
