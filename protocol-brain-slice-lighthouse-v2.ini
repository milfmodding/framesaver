# Framesaver measurement protocol - brain-slicing A/B, Lighthouse, SECOND PASS.
#
# Copy to  BepInEx\config\framesaver.protocol.ini  to arm. Read at RAID START.
#
# WHY A SECOND VERSION RATHER THAN RE-RUNNING v1. Three defects in v1 were found
# by running it, and two of them would have made a rerun read as a null.
#
# ---------------------------------------------------------------------
# DEFECT 1: THE DOSE WAS SET BY THE FLOOR, NOT BY THE PERIOD.
# ---------------------------------------------------------------------
#
# Delta found this in raid 1. perFrame = ceil(live x dt / period), clamped UP to
# `Minimum brains per frame`. At 25 live and 13.9 ms frames,
# ceil(25 / (0.1 / 0.0139)) = 4 - which is exactly the floor. So the period and
# the floor were indistinguishable, and the observed 5.9x dose cut was the FLOOR
# doing the work while the log recorded a period change.
#
# The consequence for any naive rerun: lowering the period without lowering
# min-brains delivers the SAME dose and reads as a null - a null caused by the
# arm definition rather than by the mechanism.
#
# So every block now states `Minimum brains per frame` EXPLICITLY, exactly as
# v1 already did for the period and for the same reason: an unstated knob is
# inherited from disk, and an inherited knob is a confound wearing no label.
# The treatment here is deliberately STILL "slicing with floor 4" - that is the
# thing v1 measured and the thing worth replicating. Attribute the result to
# slicing-with-a-floor, never to 0.1 specifically. Separating the two knobs is a
# DIFFERENT experiment and needs a block where the floor is lowered so the period
# can bind; do not smuggle it in here.
#
# ---------------------------------------------------------------------
# DEFECT 2: THE FIRST THREE MINUTES CARRY ALL THE VARIANCE.
# ---------------------------------------------------------------------
#
# Delta's within-block standard deviations on aiTotal.avg in raid 1:
#
#     block 1 (early)   0.478 ms      <- window 3 alone spans 0.720 to 1.648
#     block 2           0.064 ms
#     block 3 (late)    0.006 ms
#
# Pooled across all blocks that is 0.259 ms. Pooled across the blocks AFTER the
# first it is 0.050 ms - 5.2x smaller. The early-raid floor is not the
# instrument's floor, and using the pooled figure is what made me tell Sophia a
# rerun could not resolve a 0.146 ms effect. At 0.050 it resolves at four windows
# per arm, inside eight minutes.
#
# The opening window is NOT instrument warmup and must not be described as such.
# Window 3 ran 4458 frames in 60 s - the FASTEST window of the raid - with 10
# awake bots and the player still at the spawn end of the map. The bots were
# genuinely not engaged. It is a real state with real variance, which is why
# WARMUP below is an excluded BLOCK rather than a discarded outlier: the state is
# held, labelled, and left out by its own name, not trimmed after the fact
# because it was inconvenient.
#
# ---------------------------------------------------------------------
# DEFECT 3: SIX BLOCKS OF FOUR MINUTES WAS MORE RAID THAN SOPHIA GETS.
# ---------------------------------------------------------------------
#
# v1 needed 24 minutes of held measurement and the raid ended at 11 - an AGL
# round from the Rogues. Four measurement blocks of three minutes needs 12, plus
# 3 for WARMUP. A design that fits inside the raid Sophia actually survives is
# worth more than a design that is better on paper and never completes.
#
# ABAB rather than ABA: it balances exposure 50/50 instead of v1's control-heavy
# split, and it gives two independent replications of the contrast. ABA absorbs
# LINEAR drift in its bracket mean already - Delta's correction to me, and the
# reason v1's ramp was not the problem I claimed - but ABAB additionally survives
# curvature, which is what ABA cannot do.
#
# ---------------------------------------------------------------------
# WHAT TO SCORE, AND WHAT NOT TO
# ---------------------------------------------------------------------
#
# PRIMARY IS THE SAVING, aiTotal.avg. Raid 1 puts it at 0.146 ms with a 95% upper
# bound of 0.541 and a CI containing zero. This design is powered to resolve that.
#
# WITHDRAWN, AND THE CORRECTION IS THE MOST IMPORTANT LINE IN THIS FILE. An earlier
# version of this header said raid 1 excluded the top half of the registered 38-78%
# SHARE band, at share <= 47%. It does not. That figure was the saving's upper CI
# divided by (1 - r), and dividing by (1 - r) assumes each surviving tick costs what
# it used to. Delta rejected exactly that: per-tick cost inflates by at least 3x for
# EVERY admissible fixed component, so roughly half the deferred work comes back as
# more expensive ticks. Correct the divisor to (1 - r*k) and the same CI gives 88%
# at k=3.29 and over 100% at k=4.27 - which is not an upper bound on anything.
#
# So: THE CONTRAST MEASURES THE SAVING AND DOES NOT IDENTIFY THE SHARE. The share
# instrument is aiTotal.min, because under slicing only ~4 of 23 agents tick per
# frame, so the cheapest frame in a window nearly isolates the fixed component and
# bounds it ONE WAY - any lower fixed cost makes the share larger. Delta's bound is
# share >= 37.2%, landing on the registered band's lower edge.
#
# The two reconcile at an inflation of k = 4.24, which sits inside Delta's
# independently derived 3.29-4.76. So the registered share may well be RIGHT and the
# broken inference was "big share implies big saving".
#
# WHAT THIS MEANS FOR THIS PROTOCOL: report aiTotal.min per block beside aiTotal.avg,
# and compare POPULATION-MATCHED adjacent blocks rather than standardising for live.
# Delta's bound came from w9/w10 against w12/w13 at live == 23 exactly. ABAB with
# three-minute blocks is chosen partly for that - adjacent blocks sit close in
# population, so a matched pair exists without modelling one.
#
# frame.p50 IS NOT SCOREABLE HERE AND THE REASON MATTERS. In raid 1 its bracket
# contrast was +0.335 ms - LARGER than the aiTotal drop - and it is drift, not
# effect. frame.p50 was monotone in raid order (14.784 -> 13.898 -> 13.683) while
# aiTotal was not (1.384 -> 1.245 -> 1.398), and a monotone ramp cannot produce a
# middle dip. The ramp is independently visible in a quantity the arm does not
# touch: updateManual awake ms/call rose 0.0338 -> 0.1018 monotonically across all
# ten windows, unbroken by the arm. So a positive p50 number will appear in this
# table too, and it must be reported as drift rather than quoted as a saving.
#
# ENGAGEMENT CHECK, and it cannot be tickedSum/liveSum alone - that ratio is
# 1.0000 by construction in the control arm. Use `agents.slicing` and
# `agents.suppressSlicing`. `Defer to other AI mods` must be false before launch
# or BigBrain suppresses slicing while the log still reports the period you asked
# for.

name = brain-slice-lighthouse-v2

# --- Excluded. Hold position, let the map settle. -------------------
#
# Labelled so it pools with nothing. Three minutes, then press.
[WARMUP]
Brain update period = 0
Minimum brains per frame = 4

# --- Four measurement blocks, three minutes each. -------------------

[B1]
Brain update period = 0
Minimum brains per frame = 4

[B2]
Brain update period = 0.1
Minimum brains per frame = 4

[B1]
Brain update period = 0
Minimum brains per frame = 4

[B2]
Brain update period = 0.1
Minimum brains per frame = 4

# Stand-down. Not a measurement block. Advance() writes ConfigEntry.BoxedValue
# and nothing restores it, so a raid ending on B2 leaves 0.1 live in memory and
# every later raid runs silently sliced. Press on extraction.
[standdown]
Brain update period = 0
Minimum brains per frame = 4
